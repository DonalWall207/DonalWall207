<svg xmlns="http://www.w3.org/2000/svg" width="485" height="225" viewBox="0 0 485 225" font-family="'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif">
<style>@keyframes grow{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}.in{animation:grow .6s ease-out both}</style>
<rect x=".5" y=".5" width="484" height="224" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="25" y="38" font-size="18" font-weight="600" fill="#953800">Most Used Languages</text>
<clipPath id="bar"><rect x="25" y="58" width="435" height="10" rx="5"/></clipPath>
<g clip-path="url(#bar)">
<rect x="25.00" y="58" width="435.50" height="10" fill="#c2cfde"/>
</g>
<g class="in" style="animation-delay:150ms"><circle cx="30" cy="97" r="5" fill="#c2cfde"/><text x="43" y="102" font-size="13" fill="#24292f">Run the workflow to load languages</text></g>
</svg>